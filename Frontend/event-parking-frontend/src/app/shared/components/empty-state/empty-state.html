<div class="empty-state glass-panel">

  <div class="empty-icon">
    ✦
  </div>

  <h3>
    {{ title }}
  </h3>

  <p>
    {{ message }}
  </p>

  @if (actionLabel) {
    <button
      type="button"
      class="btn btn-primary"
      (click)="action.emit()"
    >
      {{ actionLabel }}
    </button>
  }

</div>
