<article class="stat-card surface-card card-3d">

  <div class="stat-top">

    <div class="stat-icon depth-layer-sm">
      {{ icon }}
    </div>

    <span class="stat-decoration"></span>

  </div>

  <div class="stat-content depth-layer">

    <p class="stat-title">
      {{ title }}
    </p>

    <h3 class="stat-value">
      {{ value }}
    </h3>

    @if (subtitle) {
      <p class="stat-subtitle">
        {{ subtitle }}
      </p>
    }

  </div>

</article>
