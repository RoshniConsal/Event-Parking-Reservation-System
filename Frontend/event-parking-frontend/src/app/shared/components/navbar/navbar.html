<header class="navbar">

  <div class="container navbar-inner">

    <a
      routerLink="/"
      class="brand"
    >
      <img
        [src]="logoPath"
        alt="VenueFlow logo"
        class="brand-logo"
      />

      <div class="brand-copy">
        <span class="brand-title">
          {{ brand }}
        </span>

        <span class="brand-tagline">
          Events. Seats. Parking. Simplified.
        </span>
      </div>
    </a>


    <nav class="nav-links">

      @for (
        item of items;
        track item.route
      ) {

        <a
          [routerLink]="item.route"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{
            exact: item.route === '/'
          }"
        >
          {{ item.label }}
        </a>

      }

    </nav>


    @if (showLogout) {

      <button
        type="button"
        class="logout-btn"
        (click)="logout()"
      >
        Logout
        <span>→</span>
      </button>

    } @else if (showLogin) {

      <div class="auth-actions">

        <a
          routerLink="/customer-login"
          class="customer-login-btn"
        >
          Customer Login
        </a>

        <a
          routerLink="/admin-login"
          class="admin-login-btn"
        >
          Admin Login
        </a>

      </div>

    }

  </div>

</header>
